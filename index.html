<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!-- outfit font from google fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Faculty+Glyphic&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>Login Authentication</title>
  </head>
  <body>
    <main>
      <h1 class="heading" id="form-title">Sign Up</h1>
      <section class="container">
        <!-- sign up form  -->
        <form id="register-form" class="left-container register">
          <input
            type="username"
            id="register-username"
            name="username"
            placeholder="user name"
            required
          />
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="password@123"
            required
          />

          <div>
            <button type="submit" class="submit-button" id="register-btn">Sign Up</button>
            <p class="sign-text">
              Already have an account? <a href="#" class="sign-link" id="login-link">Login here</a>
            </p>
          </div>
        </form>

        <form id="login-form" class="left-container login">
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="password@123"
            required
          />

          <div>
            <button type="submit" class="submit-button" id="login-btn">Login</button>
            <p class="sign-text">
              Already have an account? <a href="#" class="sign-link" id="register-link">Register here</a>
            </p>
          </div>
        </form>

        <!-- other login options  -->
        <section class="right-container">
          <p class="other-text">Or Continue with:</p>
          <button class="other-btn">Google</button
          ><button class="other-btn">Facebook</button
          ><button class="other-btn github">Github</button>
        </section>
      </section>
    </main>
  </body>
  <script src="script.js"></script>
</html>
